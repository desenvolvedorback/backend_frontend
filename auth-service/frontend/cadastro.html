<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina de Cadastro</title>
   <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Pagina de Cadastro</h1>
    <h2>Digite suas informações para efeituar o cadastro.</h2>

    <div class="card">
        <div class="card-body">
            <div id="statusMensagem" role="alert" style="display: none;"></div>
            <form id="formCadastro">
                <div class="formCadastro">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" required placeholder="Ex: Marcos Vinicius">
                </div>
                <div class="formCadastro">
                    <label for="sobrenome">Sobrenome:</label>
                    <input type="text" id="sobrenome" name="sobrenome" required placeholder="Ex: Silva">
                </div>
                <div class="formCadastro">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required placeholder="Ex: marcos.silva@example.com">
                </div>
                <div class="formCadastro">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required placeholder="Ex: ********">
                </div>
                <button type="submit">Cadastrar</button>
            </form>
        </div>
    </div>
    
    <card class="rodape">
        <p>Já possui uma conta? <a href="login.html">Faça login aqui</a></p>
    </card>

    <footer id="final">
        <p>© 2026 Davi Leonardo. Todos os direitos reservados.</p>
    </footer>
</body>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="auth.js"></script>

</html>
